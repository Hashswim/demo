name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
  api:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/api}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - run: gradle test bootJar
  ai:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: services/ai}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.17.3}
      - run: helm lint infra/helm/staffing --set secrets.existingSecret=ci-secret --set web.tlsSecret=ci-tls
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.10.5'}
      - run: terraform fmt -check -recursive infra/terraform
  image-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {context: apps/web, image: staffing-web}
          - {context: apps/api, image: staffing-api}
          - {context: services/ai, image: staffing-ai}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: ${{ matrix.image }}:ci
