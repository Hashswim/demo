apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "staffing.name" . }}-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "staffing.name" . }}-backup
  {{- with .Values.backup.serviceAccountRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.postgres.storageClass }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: 'true'
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "staffing.name" . }}-nginx
data:
  default.conf: |
    server {
      listen 443 ssl;
      server_name {{ .Values.web.serverName }};
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      root /usr/share/nginx/html;
      location / { try_files $uri $uri/ /index.html; }
      location /api/ {
        proxy_pass http://{{ include "staffing.name" . }}-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
      }
      location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    }
