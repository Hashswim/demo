{{- if .Values.model.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "staffing.name" . }}-model
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: '{{ include "staffing.name" . }}-model'}
  template:
    metadata:
      labels: {app: '{{ include "staffing.name" . }}-model'}
    spec:
      serviceAccountName: {{ include "staffing.name" . }}-app
      containers:
        - name: model
          image: {{ .Values.images.model | quote }}
          args: [-m, '/models/{{ .Values.model.file }}', --host, 0.0.0.0, --port, '8080', --alias, qwen-local, -c, '4096', -t, '4']
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /health, port: 8080}, failureThreshold: 120, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /health, port: 8080}}
          livenessProbe: {httpGet: {path: /health, port: 8080}}
          resources: {{ toYaml .Values.resources.model | nindent 12 }}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: '{{ required "model.existingClaim required" .Values.model.existingClaim }}'}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "staffing.name" . }}-model
spec:
  type: ClusterIP
  selector: {app: '{{ include "staffing.name" . }}-model'}
  ports: [{name: http, port: 8080, targetPort: 8080}]
{{- end }}
