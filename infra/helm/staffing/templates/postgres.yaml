apiVersion: v1
kind: Service
metadata:
  name: {{ include "staffing.name" . }}-postgres
spec:
  clusterIP: None
  selector: {app: '{{ include "staffing.name" . }}-postgres'}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "staffing.name" . }}-postgres
spec:
  serviceName: {{ include "staffing.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {app: '{{ include "staffing.name" . }}-postgres'}
  template:
    metadata:
      labels: {app: '{{ include "staffing.name" . }}-postgres'}
    spec:
      serviceAccountName: {{ include "staffing.name" . }}-app
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom: [{secretRef: {name: '{{ include "staffing.secret" . }}'}}]
          env: [{name: PGDATA, value: /var/lib/postgresql/data/pgdata}]
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
          resources: {{ toYaml .Values.resources.postgres | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
